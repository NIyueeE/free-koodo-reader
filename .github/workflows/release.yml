name: Build/release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Verify once on Linux (typecheck, lint, tests, renderer build). The
  # per-OS packaging jobs below consume the built renderer artifact, so the
  # slow Windows/ARM jobs no longer duplicate the whole verification stage.
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          # Filter known third-party/environment advisories (yarn 1 workspace
          # quirk from recharts/es-toolkit manifests, node Buffer() deprecation
          # from electron-builder's native rebuild). Failures still surface.
          yarn install --frozen-lockfile 2>&1 | grep -vE "Workspaces can only be enabled|DeprecationWarning: Buffer|trace-deprecation" |
            cat

      - name: TypeScript type check
        run: npx tsc --noEmit --noUnusedLocals false --noUnusedParameters false

      - name: ESLint (zero warnings allowed)
        shell: bash
        run: yarn lint --max-warnings 0

      - name: Unit + smoke tests (i18n / platform / WebDAV live / IPC contract / preload / database service)
        shell: bash
        run: CI=true yarn test --watchAll=false --passWithNoTests

      # Critical: the renderer bundle is not committed (build/ is git-ignored).
      # Packaging without it produces an app with a blank/white screen.
      - name: Build production bundle (renderer)
        run: yarn build

      - name: Verify renderer bundle exists (prevents white-screen releases)
        shell: bash
        run: |
          if [ ! -f build/index.html ]; then
            echo "::error::build/index.html is missing - the packaged app would show a white screen. Run yarn build before packaging."
            exit 1
          fi
          echo "Renderer bundle present: $(du -sh build | cut -f1)"

      # Static guard: every module main.js/preload.js require must be matched
      # by a build.files pattern, or the packaged app crashes on launch with
      # "Cannot find module" (v3.0.4 shipped like this for webdavCloud.js).
      - name: Verify build.files covers main-process requires
        run: node scripts/verify-package-files.js

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build
          if-no-files-found: error

  release:
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 120

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}

    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, ubuntu-24.04-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "yarn"

      # The electron zips (~106 MB per job) are re-downloaded on every run;
      # cache them so re-tags and the packaged smoke test are faster.
      - name: Cache Electron binaries
        if: startsWith(matrix.os, 'ubuntu-22.04')
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          # Filter known third-party/environment advisories (yarn 1 workspace
          # quirk from recharts/es-toolkit manifests, node Buffer() deprecation
          # from electron-builder's native rebuild). Failures still surface.
          yarn install --frozen-lockfile 2>&1 | grep -vE "Workspaces can only be enabled|DeprecationWarning: Buffer|trace-deprecation" |
            cat

      - name: Download web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build

      - name: Install Gcc
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: |
          sudo apt update
          sudo apt-get install gcc-multilib g++-multilib

      - name: Install FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          sudo apt update
          sudo apt-get install -y ruby-full build-essential zlib1g-dev liblzma-dev
          sudo gem install --no-document fpm

      - name: Set environment variable USE_SYSTEM_FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: echo "USE_SYSTEM_FPM=true" >> $GITHUB_ENV

      - name: Set environment variable USE_HARD_LINKS
        run: echo "USE_HARD_LINKS=false" >> $GITHUB_ENV

      - name: Modify package.json for dev branch
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            powershell -Command "(Get-Content package.json) -replace '\"productName\": \"Free Koodo Reader\"', '\"productName\": \"Free Koodo Reader DEV\"' | Set-Content package.json"
          else
            sed -i.bak 's/"productName": "Free Koodo Reader"/"productName": "Free Koodo Reader DEV"/' package.json
          fi

      - name: Modify package.json for Linux arm64 build
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          jq '.build.linux.target = [
            {
              "target": "deb",
              "arch": ["arm64"]
            },
            {
              "target": "AppImage",
              "arch": ["arm64"]
            }
          ]' package.json > package.json.tmp && mv package.json.tmp package.json

      # End-to-end guard: launch the exact unpacked artifact layout that gets
      # published and verify the renderer mounts. Catches packaging
      # regressions (missing asar files, broken natives) that source-tree
      # smoke tests cannot see.
      - name: Install Xvfb (packaged smoke test)
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Package app unpacked (for packaged smoke test)
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: npx electron-builder --dir

      - name: Smoke test packaged app (prevents shipping unlaunchable builds)
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: xvfb-run -a --server-args="-screen 0 1366x768x24" node scripts/packaged-smoke-test.js

      - name: Upload packaged smoke screenshot
        if: always() && startsWith(matrix.os, 'ubuntu-22.04')
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-screenshot
          path: build/packaged-smoke-screenshot.png
          if-no-files-found: ignore

      - name: Build/release Electron app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            yarn electron-builder --publish always
          else
            yarn electron-builder
          fi

  android:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "yarn"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          # Filter known third-party/environment advisories (yarn 1 workspace
          # quirk from recharts/es-toolkit manifests, node Buffer() deprecation
          # from electron-builder's native rebuild). Failures still surface.
          yarn install --frozen-lockfile 2>&1 | grep -vE "Workspaces can only be enabled|DeprecationWarning: Buffer|trace-deprecation" |
            cat

      - name: Build production bundle
        run: yarn build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android release APK (signed with release keystore)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signing and renderer presence
        shell: bash
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          if ! unzip -l "$APK" | grep -q "assets/public/index.html"; then
            echo "::error::APK does not contain assets/public/index.html (white-screen risk)"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -qv "META-INF/.*\.RSA"; then
            echo "::error::APK appears unsigned"
            exit 1
          fi
          # Verify the release keystore signature (apksigner from the SDK).
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          APKSIGNER="${BUILD_TOOLS}apksigner"
          if [ -x "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify --print-certs "$APK" | head -3
          else
            echo "::warning::apksigner not found; skipping signature certificate check"
          fi
          echo "APK checks passed"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" android/app/build/outputs/apk/release/*.apk --clobber

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
