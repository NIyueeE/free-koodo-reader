name: Build/release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}

    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, ubuntu-24.04-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install

      - name: TypeScript type check
        run: npx tsc --noEmit --noUnusedLocals false --noUnusedParameters false

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3
        if: startsWith(matrix.os, 'ubuntu-22.04')

      - name: Install Gcc
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: |
          sudo apt update
          sudo apt-get install gcc-multilib g++-multilib

      - name: Install FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          sudo apt update
          sudo apt-get install -y ruby-full build-essential zlib1g-dev liblzma-dev
          sudo gem install --no-document fpm

      - name: Set environment variable USE_SYSTEM_FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: echo "USE_SYSTEM_FPM=true" >> $GITHUB_ENV

      - name: Set environment variable USE_HARD_LINKS
        run: echo "USE_HARD_LINKS=false" >> $GITHUB_ENV

      - name: Modify package.json for dev branch
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            powershell -Command "(Get-Content package.json) -replace '\"productName\": \"Free Koodo Reader\"', '\"productName\": \"Free Koodo Reader DEV\"' | Set-Content package.json"
          else
            sed -i.bak 's/"productName": "Free Koodo Reader"/"productName": "Free Koodo Reader DEV"/' package.json
          fi

      - name: Modify package.json for Linux arm64 build
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          jq '.build.linux.target = [
            {
              "target": "deb",
              "arch": ["arm64"]
            },
            {
              "target": "AppImage",
              "arch": ["arm64"]
            }
          ]' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Build/release Electron app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            yarn electron-builder --publish always
          else
            yarn electron-builder
          fi

  android:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "yarn"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build production bundle
        run: yarn build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" android/app/build/outputs/apk/release/*.apk --clobber
