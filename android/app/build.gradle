apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing configuration.
//
// Priority order:
//   1. CI secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
//      ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) - used by GitHub Actions.
//   2. Committed keystore.properties (android/app/keystore.properties) +
//      android/app/keystore/free-koodo-reader.jks - used for local builds and
//      as the default for reproducible fork releases.
//   3. Debug signing as a last-resort fallback (local dev only).
// ---------------------------------------------------------------------------
import java.util.Properties

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def ciKeystoreBase64 = System.getenv("ANDROID_KEYSTORE_BASE64")
def hasReleaseSigning = ciKeystoreBase64 != null || keystoreProperties.containsKey("storeFile")

if (ciKeystoreBase64) {
    // Decode the keystore provided as a CI secret into android/app/keystore/.
    def keystoreDir = file('keystore')
    keystoreDir.mkdirs()
    def keystoreFile = new File(keystoreDir, System.getenv("ANDROID_KEYSTORE_FILE") ?: "free-koodo-reader.jks")
    keystoreFile.bytes = ciKeystoreBase64.decodeBase64()
    if (!keystoreFile.exists() || keystoreFile.length() == 0) {
        throw new GradleException("Failed to restore ANDROID_KEYSTORE_BASE64 into " + keystoreFile)
    }
    // Re-read so the values below pick up the decoded file.
    keystoreProperties.setProperty("storeFile", keystoreFile.path)
    if (!keystoreProperties.contains("storePassword")) {
        keystoreProperties.setProperty("storePassword", System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "")
    }
    if (!keystoreProperties.contains("keyAlias")) {
        keystoreProperties.setProperty("keyAlias", System.getenv("ANDROID_KEY_ALIAS") ?: "")
    }
    if (!keystoreProperties.contains("keyPassword")) {
        keystoreProperties.setProperty("keyPassword", System.getenv("ANDROID_KEY_PASSWORD") ?: "")
    }
}

println "Android release signing: " + (hasReleaseSigning ? "release keystore" : "debug keystore (fallback)")

android {
    namespace = "xyz.freekoodo.reader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "xyz.freekoodo.reader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3001
        versionName "3.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
