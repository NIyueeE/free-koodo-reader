# Android release signing for free-koodo-reader.
# Default keystore committed for reproducible fork builds (this project is not
# published to app stores). CI can override the credentials via secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
storeFile=keystore/free-koodo-reader.jks
storePassword=free-koodo-reader
keyAlias=free-koodo-reader
keyPassword=free-koodo-reader
